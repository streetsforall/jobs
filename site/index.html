<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Public Sector Jobs | Streets For All</title>
<meta name="description" content="Open planning, engineering, outreach, GIS and project management jobs at LA-area public agencies, updated daily by Streets For All.">
<!--
  The job board lives on streetsforall.org as a Squarespace page that loads embed.js.
  This page is a plain fallback / preview of the same widget, and the host for
  jobs.json + embed.js. Set REDIRECT to the Squarespace page URL once it is live.
-->
<script>
  var REDIRECT = "https://www.streetsforall.org/jobs";
  if (REDIRECT && !/[?&]preview\b/.test(location.search)) location.replace(REDIRECT);
</script>
<style>
  body { margin: 0; font: 17px/1.6 "Helvetica Neue", Arial, sans-serif; color: #333; background: #fff; }
  header { background: #1b1b1b; color: #fff; padding: 18px 16px; }
  header a { color: #fff; text-decoration: none; font-weight: 700; }
  main { max-width: 960px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 36px; line-height: 1.15; margin: 0 0 8px; color: #173861; }
  .intro { margin: 0 0 24px; max-width: 65ch; }
</style>
</head>
<body>
<header><a href="https://www.streetsforall.org">Streets For All</a></header>
<main>
  <h1>Public sector jobs</h1>
  <p class="intro">Open planning, engineering, outreach, GIS and project management jobs at LA-area public agencies, updated every morning.</p>
  <div id="sfa-jobs"></div>
</main>
<script src="embed.js" defer></script>
</body>
</html>
